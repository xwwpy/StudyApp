[package]
name = "studyapp-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "studyapp"
path = "src/main.rs"

[features]
ui-test = ["gpui-kit/test-support"]

[dependencies]
studyapp-core = { version = "0.1.0", path = "../studyapp-core" }
anyhow = "1"
chrono = "0.4"
directories = "6"
gpui-kit = "=0.7.3"
pulldown-cmark = "0.13"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"
