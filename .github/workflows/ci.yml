name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  editor:
    uses: ./.github/workflows/editor.yml
  core:
    name: Core and sync (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: core-sync-${{ matrix.os }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p studyapp-core -p studyapp-sync

  windows:
    name: Windows desktop and native smoke
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: desktop-windows
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked -p studyapp-desktop --features ui-test
      - name: Exercise native window and capture five pages
        timeout-minutes: 3
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP ('studyapp-smoke-' + [guid]::NewGuid().ToString('N'))
          "SMOKE_DIR=$smokeDir" >> $env:GITHUB_ENV
          ./scripts/smoke.ps1 -DataDirectory $smokeDir
      - name: Preserve native screenshots and result
        if: always() && env.SMOKE_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-smoke
          path: |
            ${{ env.SMOKE_DIR }}/*.png
            ${{ env.SMOKE_DIR }}/smoke-result.txt
            ${{ env.SMOKE_DIR }}/library-smoke-result.txt
            ${{ env.SMOKE_DIR }}/*.log
          if-no-files-found: warn
          retention-days: 14
