[package]
name = "studyapp-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "studyapp"
path = "src/main.rs"

[features]
ui-test = ["gpui-kit/test-support"]

[dependencies]
studyapp-core = { version = "0.5.0", path = "../studyapp-core" }
studyapp-sync = { version = "0.5.0", path = "../studyapp-sync" }
anyhow = "1"
chrono = "0.4"
directories = "6"
gpui-kit = "=0.7.3"
pulldown-cmark = "0.13"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
wry = "=0.57.0"
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"
