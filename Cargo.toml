[workspace]
members = ["crates/studyapp-core", "crates/studyapp-desktop"]
default-members = ["crates/studyapp-desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/xwwpy/StudyApp"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
