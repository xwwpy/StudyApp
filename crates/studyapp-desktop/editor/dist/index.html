<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; media-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>StudyApp 笔记编辑器</title>
  <link rel="stylesheet" href="editor.css">
  <script defer src="editor.js"></script>
</head>
<body>
  <main aria-label="Markdown 笔记编辑器">
    <div id="toolbar" role="toolbar" aria-label="笔记格式">
      <button type="button" data-command="heading" title="标题" aria-label="标题">H</button>
      <button type="button" data-command="bold" title="粗体 · Ctrl+B" aria-label="粗体"><strong>B</strong></button>
      <button type="button" data-command="italic" title="斜体 · Ctrl+I" aria-label="斜体"><em>I</em></button>
      <button type="button" data-command="code" title="行内代码" aria-label="行内代码">&lt;/&gt;</button>
      <span class="separator"></span>
      <button type="button" data-command="bullet" title="列表" aria-label="列表">≡</button>
      <button type="button" data-command="task" title="任务列表" aria-label="任务列表">☑</button>
      <button type="button" data-command="quote" title="引用" aria-label="引用">❝</button>
      <span class="separator"></span>
      <button type="button" data-command="undo" title="撤销 · Ctrl+Z" aria-label="撤销">↶</button>
      <button type="button" data-command="redo" title="重做 · Ctrl+Shift+Z" aria-label="重做">↷</button>
      <span id="editor-status" role="status" aria-live="polite"></span>
      <button type="button" id="source-toggle" data-command="source" aria-label="源码模式" aria-pressed="false">Markdown</button>
    </div>
    <div id="editor"></div>
  </main>
</body>
</html>
